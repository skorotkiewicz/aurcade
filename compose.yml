name: aurcade

services:
  aurcade:
    image: ghcr.io/skorotkiewicz/aurcade
    container_name: aurcade
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./keys:/etc/aurcade/keys:ro
      - ./repositories:/var/lib/aurcade
      - ./ssh_host_keys:/etc/ssh/host_keys
