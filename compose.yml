name: aurcade

services:
  # anubis:
  #   image: ghcr.io/techarohq/anubis:v1.27.0
  #   container_name: anubis
  #   restart: unless-stopped
  #   depends_on:
  #     - aurcade
  #   environment:
  #     BIND: ":8080"
  #     TARGET: "http://aurcade:80"
  #     POLICY_FNAME: "/data/cfg/botPolicy.yaml"
  #     # REDIRECT_DOMAINS: "aurcade.sekor.eu.org,http://localhost:8080,http://127.0.0.1:8080"
  #     USE_REMOTE_ADDRESS: "true"
  #   healthcheck:
  #     test: ["CMD", "anubis", "--healthcheck"]
  #     interval: 5s
  #     timeout: 30s
  #     retries: 5
  #     start_period: 500ms
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./botPolicy.yaml:/data/cfg/botPolicy.yaml:ro

  setup:
    image: ghcr.io/skorotkiewicz/aurcade
    container_name: aurcade-setup
    build:
      context: .
      dockerfile: docker/aurcade/Dockerfile
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["aurcade setup && aurcade generate-services"]
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./services/irc.toml:/etc/aurcade/irc.toml:ro
      - ./services/xmpp.toml:/etc/aurcade/xmpp.toml:ro
      - ./services/soju.toml:/etc/aurcade/soju.toml:ro
      - ./services/mail.toml:/etc/aurcade/mail.toml:ro
      - ./keys:/etc/aurcade/keys:ro
      - ./aurcade_data/tls:/etc/aurcade/tls
      - ./aurcade_data/repositories:/var/lib/aurcade
      - ./aurcade_data/srv/service_config:/etc/aurcade/services

  aurcade:
    image: ghcr.io/skorotkiewicz/aurcade
    container_name: aurcade
    build:
      context: .
      dockerfile: docker/aurcade/Dockerfile
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      ergo:
        condition: service_started
      prosody:
        condition: service_started
      soju:
        condition: service_started
      snappymail:
        condition: service_started
    expose:
      - "9000"
    ports:
      - "8080:443"
      - "2222:22"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/cgit.css"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./services/irc.toml:/etc/aurcade/irc.toml:ro
      - ./services/xmpp.toml:/etc/aurcade/xmpp.toml:ro
      - ./services/soju.toml:/etc/aurcade/soju.toml:ro
      - ./services/mail.toml:/etc/aurcade/mail.toml:ro
      - ./keys:/etc/aurcade/keys:ro
      - ./aurcade_data/tls:/etc/aurcade/tls
      - ./aurcade_data/repositories:/var/lib/aurcade
      - ./aurcade_data/ssh_host_keys:/etc/ssh/host_keys
      - ./aurcade_data/srv/service_config:/etc/aurcade/services

  ergo:
    image: ghcr.io/skorotkiewicz/aurcade-ergo
    container_name: ergo
    build:
      context: .
      dockerfile: docker/ergo/Dockerfile
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "6697:6697"
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./aurcade_data/tls:/etc/aurcade/tls:ro
      - ./aurcade_data/srv/service_config:/etc/aurcade/services:ro
      - ./aurcade_data/srv/ergo_data:/var/lib/ergo

  prosody:
    image: ghcr.io/skorotkiewicz/aurcade-prosody
    container_name: prosody
    build:
      context: .
      dockerfile: docker/prosody/Dockerfile
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "5222:5222"
      - "5269:5269"
      - "5280:5280"
      - "5281:5281"
    volumes:
      - ./aurcade_data/tls:/etc/aurcade/tls:ro
      - ./aurcade_data/srv/service_config:/etc/aurcade/services:ro
      - ./aurcade_data/srv/prosody_data:/var/lib/prosody

  soju:
    image: ghcr.io/skorotkiewicz/aurcade-soju
    container_name: soju
    build:
      context: .
      dockerfile: docker/soju/Dockerfile
    restart: unless-stopped
    depends_on:
      ergo:
        condition: service_started
    ports:
      - "6698:6698"
    volumes:
      - ./aurcade_data/srv/service_config:/etc/aurcade/services:ro
      - ./aurcade_data/srv/soju_data:/soju-data

  maddy:
    image: ghcr.io/skorotkiewicz/aurcade-maddy
    container_name: maddy
    build:
      context: .
      dockerfile: docker/maddy/Dockerfile
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 && nc -z 127.0.0.1 587 && nc -z 127.0.0.1 993"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./aurcade_data/srv/service_config:/etc/aurcade/services:ro
      - ./aurcade_data/srv/maddy_data:/data

  snappymail:
    image: ghcr.io/skorotkiewicz/aurcade-snappymail
    container_name: snappymail
    build:
      context: .
      dockerfile: docker/snappymail/Dockerfile
    restart: unless-stopped
    depends_on:
      maddy:
        condition: service_started
    expose:
      - "8888"
    environment:
      SECURE_COOKIES: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./aurcade_data/srv/service_config:/etc/aurcade/services:ro
      - ./aurcade_data/srv/snappymail_data:/var/lib/snappymail

