name: aurcade

services:
  # anubis:
  #   image: ghcr.io/techarohq/anubis:v1.27.0
  #   container_name: anubis
  #   restart: unless-stopped
  #   depends_on:
  #     - aurcade
  #   environment:
  #     BIND: ":8080"
  #     TARGET: "http://aurcade:80"
  #     POLICY_FNAME: "/data/cfg/botPolicy.yaml"
  #     # REDIRECT_DOMAINS: "aurcade.sekor.eu.org,http://localhost:8080,http://127.0.0.1:8080"
  #     USE_REMOTE_ADDRESS: "true"
  #   healthcheck:
  #     test: ["CMD", "anubis", "--healthcheck"]
  #     interval: 5s
  #     timeout: 30s
  #     retries: 5
  #     start_period: 500ms
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./botPolicy.yaml:/data/cfg/botPolicy.yaml:ro

  aurcade:
    image: ghcr.io/skorotkiewicz/aurcade
    container_name: aurcade
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      ergo:
        condition: service_started
    expose:
      - "9000"
    ports:
      - "8080:80"
      - "2222:22"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/cgit.css"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./irc.toml:/etc/aurcade/irc.toml:ro
      - ./xmpp.toml:/etc/aurcade/xmpp.toml:ro
      - ./soju.toml:/etc/aurcade/soju.toml:ro
      - ./keys:/etc/aurcade/keys:ro
      - ./tls:/etc/aurcade/tls
      - ./repositories:/var/lib/aurcade
      - ./ssh_host_keys:/etc/ssh/host_keys
      - ./srv/service_config:/etc/aurcade/services

  ergo:
    image: ghcr.io/skorotkiewicz/aurcade-ergo
    container_name: ergo
    build:
      context: .
      dockerfile: docker/Ergo.Dockerfile
    restart: unless-stopped
    ports:
      - "6697:6697"
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./tls:/etc/aurcade/tls:ro
      - ./srv/service_config:/etc/aurcade/services:ro
      - ./srv/ergo_data:/var/lib/ergo

  prosody:
    image: ghcr.io/skorotkiewicz/aurcade-prosody
    container_name: prosody
    build:
      context: .
      dockerfile: docker/Prosody.Dockerfile
    restart: unless-stopped
    ports:
      - "5222:5222"
      - "5269:5269"
      - "5280:5280"
    volumes:
      - ./tls:/etc/aurcade/tls:ro
      - ./srv/service_config:/etc/aurcade/services:ro
      - ./srv/prosody_data:/var/lib/prosody

  soju:
    image: ghcr.io/skorotkiewicz/aurcade-soju
    container_name: soju
    build:
      context: .
      dockerfile: docker/Soju.Dockerfile
    restart: unless-stopped
    depends_on:
      ergo:
        condition: service_started
    ports:
      - "6698:6698"
    volumes:
      - ./srv/service_config:/etc/aurcade/services:ro
      - ./srv/soju_data:/soju-data

  maddy:
    image: ghcr.io/foxcpp/maddy:0.9.5@sha256:de42151adff6388edb5e4ee88f60334fa1ab85e309485193ecb1c2db20203315
    container_name: maddy
    restart: unless-stopped
    depends_on:
      aurcade:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/maddy/entrypoint.sh"]
    command: []
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 && nc -z 127.0.0.1 587 && nc -z 127.0.0.1 993"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./config.toml:/etc/aurcade/config.toml:ro
      - ./docker/maddy.conf:/etc/maddy/maddy.conf:ro
      - ./docker/maddy-entrypoint.sh:/etc/maddy/entrypoint.sh:ro
      - ./srv/service_config:/etc/aurcade/services:ro
      - ./srv/maddy_data:/data

