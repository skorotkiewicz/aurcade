title = "AURcade"
description = "a fast webinterface for the git dscm"
clone_prefix = "http://localhost:8080 ssh://git@localhost:2222"
# Optional CSS filename; defaults to cgit.css.
# style = "cgit-theme.css"
# Optional image filename; defaults to cgit.png.
# logo = "aurcade-logo.svg"

# Restart the container after changing accounts, keys, or paths.
[[accounts]]
name = "alice"
# Paste complete public keys here, for example: "ssh-ed25519 AAAA... alice@host"
ssh_keys = []
# Optional complete armored public keys; invalid keys warn and are ignored.
gpg_keys = []
# A trailing slash grants the namespace and allows first-push creation below it.
paths = ["example", "team/tools", "alice/"]

# Repeating a path grants both accounts write access.
