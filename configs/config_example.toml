title = "AURcade"
domain = "example.com"
# Defaults to true. Set false only for an isolated, trusted network.
tls = true
# Optional with tls = true; omit both to generate persistent self-signed TLS files.
# tls_certificate = "tls/fullchain.pem"
# tls_private_key = "tls/privkey.pem"
description = "a fast webinterface for the git dscm"
# Optional Markdown rendered as a block at the top of every cgit page.
# markdown_description = """\
# # AURcade
#
# A **homebrew**-style package archive for the AUR.
# """
clone_prefix = "https://localhost:8080 ssh://git@localhost:2222"
# Optional CSS filename; defaults to cgit.css.
# style = "cgit-theme.css"
# Optional image filename; defaults to cgit.png.
# logo = "aurcade-logo.svg"
# Optional favicon filename; defaults to favicon.ico.
# favicon = "aurcade-favicon.svg"

# Restart the container after changing accounts, keys, or paths.
[[accounts]]
name = "alice"
# Optional Argon2id hash for services that use password authentication.
# Generate one with: docker compose run --rm --no-deps aurcade hash-password
# password_hash = "$argon2id$..."
# Paste complete public keys here, for example: "ssh-ed25519 AAAA... alice@host"
ssh_keys = []
# Optional complete armored public keys; invalid keys warn and are ignored.
gpg_keys = []
# Optional public-key paths beginning with keys/, relative to this config file.
gpg_key_files = []
# A trailing slash grants the namespace and allows first-push creation below it.
paths = ["example", "team/tools", "alice/"]
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$2TfD1LlQo9U3skej4PLpsA$WSbatgAnsujML4DtTk4ChcdxV6gXvgN5F0MrtiV1bz8" # password: `demo`


# Repeating a path grants both accounts write access.
